<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRE Vocabulary Coach</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>GRE Vocabulary Coach</h1>
        <p class="subtitle">Enter a GRE word and learn it properly.</p>

        <div class="search-box">
            <input id="wordInput" type="text" placeholder="Enter a GRE word..." />
            <button id="learnBtn" type="button">Learn</button>
        </div>

        <div id="loading">Thinking...</div>
        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
